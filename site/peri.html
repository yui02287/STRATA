<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STRATA 周邊靈感本</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Noto+Serif+TC:wght@200;300;400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4F1EA;--line:#DCD5CC;--taupe:#A39382;--stone:#8C857B;--walnut:#4B3D2A;--ink:#2D2926;--gold:#9C8452;
--serif:"Cormorant Garamond","Noto Serif TC",serif;--stc:"Noto Serif TC","PMingLiU",serif;--sans:"Noto Sans TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:300;overflow:hidden}
.top{height:54px;display:flex;align-items:center;gap:18px;padding:0 24px;border-bottom:1px solid var(--line)}
.top .brand{font-family:var(--serif);letter-spacing:.45em;font-size:15px;color:var(--walnut);white-space:nowrap}
.pills{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}.pills::-webkit-scrollbar{display:none}
.pills button{flex:none;font-family:var(--sans);font-size:13px;border:none;background:none;color:var(--stone);padding:5px 12px;cursor:pointer;border-radius:20px;white-space:nowrap}
.pills button:hover{color:var(--ink)}.pills button.on{background:var(--walnut);color:#fff}
.main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(340px,1fr);height:calc(100% - 54px)}
.left{display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 45%,#ece6dc 0%,#ddd5c8 75%,#d3cabb 100%);min-width:0}
.box{flex:1;position:relative;overflow:hidden}
.item{position:absolute;inset:0;display:none;padding:56px 36px 24px}.item.on{display:block;animation:fi .45s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.v{display:none;width:100%;height:100%}.v svg{width:100%;height:100%;display:block}
.m-blank .v-blank,.m-a .v-a,.m-b .v-b,.m-c .v-c{display:block}
.badge{position:absolute;left:18px;top:14px;font-size:11.5px;letter-spacing:.2em;color:var(--stone);background:rgba(244,241,234,.85);padding:3px 10px;border:1px solid var(--line);z-index:5}
.cpy{position:absolute;right:18px;top:14px;z-index:6;display:flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:1px solid var(--line);background:rgba(255,255,255,.9);color:var(--walnut);cursor:pointer;font-family:var(--sans);font-size:12px;letter-spacing:.08em}
.cpy:hover{background:#fff;border-color:var(--gold)}.cpy span{max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .3s}.cpy:hover span,.cpy.done span{max-width:90px}
.lbar{display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid rgba(0,0,0,.06);background:rgba(244,241,234,.6)}
.lbar button{font-family:var(--sans);font-size:13px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 14px;cursor:pointer}
.lbar button:disabled{opacity:.35;cursor:default}.lbar .seg{display:flex;margin-left:auto}.lbar .seg button+button{border-left:none}
.lbar button.on{background:var(--walnut);color:#fff;border-color:var(--walnut)}
.panel{overflow-y:auto;padding:30px 30px 40px;border-left:1px solid var(--line)}
.pin{animation:fi .45s ease}.pmeta{font-size:12px;letter-spacing:.24em;color:var(--taupe)}
.pname{font-family:var(--stc);font-weight:300;font-size:30px;letter-spacing:.08em;margin:4px 0 2px}
.pkey{font-family:var(--stc);font-size:17px;color:var(--walnut);letter-spacing:.12em;margin-bottom:14px}
.idea{font-size:14.5px;line-height:1.8;color:#3c3a37;margin-bottom:10px}.idea b{font-family:var(--serif);color:var(--gold);font-weight:500;margin-right:8px}
.sub{font-size:11.5px;letter-spacing:.24em;color:var(--taupe);margin:20px 0 10px}
.rgrid{columns:2;column-gap:12px}
.ref{break-inside:avoid;margin-bottom:12px;background:#fff;border:1px solid var(--line);cursor:zoom-in;transition:transform .2s,box-shadow .2s}
.ref:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(60,45,30,.10)}.ref img{width:100%;display:block}
.ref div{padding:8px 10px 10px;font-size:12.5px;line-height:1.5;color:#3c3a37}.ref div b{font-family:var(--serif);font-weight:500;color:var(--gold);margin-right:6px}
.ref.top3 div:after{content:"●●●";float:right;color:var(--gold);font-size:9px;letter-spacing:1px;margin-top:3px}
.lb{position:fixed;inset:0;background:rgba(36,30,25,.72);display:none;align-items:center;justify-content:center;z-index:2000;padding:30px}
.lb.on{display:flex}.lb .bx{background:var(--paper);max-width:980px;width:100%;max-height:100%;display:grid;grid-template-columns:1.2fr 1fr;overflow:hidden}
.lb img{width:100%;height:100%;max-height:80vh;object-fit:contain;background:#E4DED8;display:block}
.lb .tx{padding:26px;overflow:auto}.lb h4{font-family:var(--stc);font-weight:400;font-size:20px;margin:4px 0 14px}
.lb dt{font-size:11px;letter-spacing:.18em;color:var(--stone);margin-top:12px}.lb dd{font-size:14px;color:#3c3a37}.lb dd.ap{color:var(--walnut)}
.lb .x{position:absolute;top:16px;right:20px;color:#fff;font-size:28px;cursor:pointer;background:none;border:none}
@media(max-width:900px){body{overflow:auto}.top{height:48px;padding:0 64px 0 14px!important;gap:10px}.top .brand{font-size:13px;letter-spacing:.3em}.item{padding:44px 10px 10px}.lbar{flex-wrap:wrap;gap:6px;padding:10px 12px}.lbar .seg{margin-left:0;width:100%}.lbar .seg button{flex:1;padding:9px 2px;font-size:12px}.badge{font-size:10px;left:10px;top:10px}.cpy{right:10px;top:8px}.panel{padding:22px 16px 40px}.pname{font-size:24px}.main{display:block;height:auto}.left{height:62vh}.panel{border-left:none}.lb .bx{grid-template-columns:1fr}.lb img{max-height:45vh}}
