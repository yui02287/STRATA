<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>STRATA 靈感本</title>
<meta name="theme-color" content="#F4F1EA"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>html,body{margin:0;height:100%;background:#F4F1EA;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;visibility:hidden}iframe.on{visibility:visible}
#sw{position:fixed;top:10px;right:14px;z-index:10;width:36px;height:36px;border:1px solid #DCD5CC;background:#fff;color:#4B3D2A;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:transform .35s,border-color .2s;-webkit-tap-highlight-color:transparent}
#sw:hover{border-color:#9C8452}#sw.p{transform:rotate(180deg)}
#tip{position:fixed;top:18px;right:58px;z-index:10;font:12px "Noto Sans TC",sans-serif;letter-spacing:.12em;color:#8C857B;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
@media(hover:hover){#sw:hover+#tip{opacity:1}}@media(max-width:900px){#sw{top:6px;right:10px}}
#ld{position:fixed;inset:0;z-index:20;background:#F4F1EA;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .5s}
#ld.hide{opacity:0;pointer-events:none}
#ld .st{display:flex;flex-direction:column;gap:5px;width:120px}
#ld .st i{display:block;height:9px;transform-origin:left;animation:ly 1.4s ease-in-out infinite}
#ld .st i:nth-child(1){background:#D7D2CB;animation-delay:0s}#ld .st i:nth-child(2){background:#C5B9AC;animation-delay:.12s}#ld .st i:nth-child(3){background:#A39382;animation-delay:.24s}#ld .st i:nth-child(4){background:#8C857B;animation-delay:.36s}#ld .st i:nth-child(5){background:#4B3D2A;animation-delay:.48s}
@keyframes ly{0%,100%{transform:scaleX(.25);opacity:.4}50%{transform:scaleX(1);opacity:1}}
#ld b{font:400 15px "Cormorant Garamond",Georgia,serif;letter-spacing:.6em;color:#4B3D2A;padding-left:.6em}
#ld span{font:12px "Noto Sans TC",sans-serif;letter-spacing:.2em;color:#8C857B}
@media(prefers-reduced-motion:reduce){#ld .st i{animation:none;opacity:1;transform:none}}</style></head><body>
<div id="ld" role="status" aria-live="polite"><div class="st"><i></i><i></i><i></i><i></i><i></i></div><b>STRATA</b><span>一層一層載入中⋯</span></div>
<iframe id="fb" class="on" title="手冊" allow="clipboard-write" src="site/book.html"></iframe>
<iframe id="pr" title="周邊" allow="clipboard-write"></iframe>
<button id="sw" aria-label="切換手冊／周邊"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3"/><path d="M20 16H7l3 3"/></svg></button><span id="tip">切換到 周邊</span>
<script>
const f=[document.getElementById('fb'),document.getElementById('pr')],sw=document.getElementById('sw'),tip=document.getElementById('tip'),ld=document.getElementById('ld');let v=0;const ready=[false,false];
function hide(){ld.classList.add('hide')}function showL(){ld.classList.remove('hide')}
addEventListener('message',e=>{if(e.data==='strata-ready'){const i=e.source===f[1].contentWindow?1:0;ready[i]=true;if(i===v)hide()}});
f[0].addEventListener('load',()=>{ready[0]=true;if(v===0)hide()});f[1].addEventListener('load',()=>{if(f[1].src){ready[1]=true;if(v===1)hide()}});
setTimeout(hide,8000);
function loadPeri(){if(!f[1].src)f[1].src='site/peri.html'}
function show(i){v=i;if(i===1){loadPeri();if(!ready[1])showL()}else if(ready[0])hide();
 f.forEach((x,j)=>x.classList.toggle('on',j===i));sw.classList.toggle('p',i===1);tip.textContent=i?'切換到 手冊':'切換到 周邊';
 try{localStorage.setItem('strata-view',i)}catch(e){};setTimeout(()=>{try{f[i].contentWindow.focus()}catch(e){}},60)}
sw.onclick=()=>show(1-v);
try{if(localStorage.getItem('strata-view')==='1')show(1)}catch(e){}
(window.requestIdleCallback||function(c){setTimeout(c,2500)})(()=>setTimeout(loadPeri,1500));
</script></body></html>
